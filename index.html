<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#173b66">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <title>勤怠・給与メモ</title>
</head>

<body>
    <main>
        <header>
            <h1 id="mainTitle">WORK LOG</h1>
            <p id="subTitle">勤怠・給与管理アプリ</p>
            <p>自分用・SQLで記録する試作版</p>
        </header>
        <nav class="item">
            <a href="" id="home">ホーム</a>
            <a href="">勤務予定</a>
            <a href="">勤務実績</a>
            <a href="">給与</a>
            <a href="">記録</a>
            <a href="">バックアップ</a>
        </nav>

        <section class="notice">
            <i class="fa-solid fa-database"></i>
            <span id="status">SQLiteを準備しています…</span>
        </section>
        <section class="panel">
            <button id="openText" type="button" aria-expanded="false">

                <div class="register-icon">
                    <i class="fa-solid fa-calendar-plus"></i>
                </div>

                <div class="register-title">
                    <h2>勤務登録</h2>
                    <p>今日の勤務を記録する</p>
                </div>

                <i id="arrow" class="fa-solid fa-chevron-down"></i>

            </button>
            <div id="inputArea" class="item">
                <form id="form1">
                    <label>日付
                        <input type="date" id="date" required>
                    </label>
                    <label>勤務先
                        <select id="workplace">
                            <option>守口スイミング</option>
                            <option>ロボ団</option>
                            <option>東進採点</option>
                            <option>東進・品質管理</option>
                            <option>Cinet</option>
                            <option>想彩</option>
                            <option>エイジェックマーケティング</option>
                            <option>社会経済実験</option>
                            <option>Uber Eats</option>
                            <option>Rocket Now</option>
                            <option>その他</option>
                        </select>
                    </label>
                    <label class="check">
                        <input type="checkbox" id="direct"> 金額を直接入力する（配達・研究協力など）
                    </label>
                    <div id="hourly">
                        <div class="two">
                            <label>出勤
                                <input type="time" id="start" value="09:00">
                            </label>
                            <label>退勤
                                <input type="time" id="end" value="13:00">
                            </label>
                        </div>
                        <label>時給（円）
                            <input type="number" id="rate" min="0" step="1" value="1200">
                        </label>
                        <p class="hint">※休憩・深夜割増・交通費・税金はまだ未対応。終了時刻は開始時刻より後にしてね。</p>
                    </div>
                    <div id="flat" hidden>
                        <label>受取予定額（円）
                            <input type="number" id="amount" min="0" step="1" value="0">
                        </label>
                    </div>
                    <p id="preview" class="preview">計算中…</p>
                    <button type="submit" id="save" disabled>勤務記録を保存

                    </button>
                </form>

            </div>

        </section>

        <footer>試行版 v0.1／個人用。バックアップ推奨</footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.13.0/dist/sql-wasm.js"></script>
    <script src="home.js"></script>
</body>

</html>
